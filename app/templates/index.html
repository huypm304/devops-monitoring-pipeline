<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gauge.js/1.3.7/gauge.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6; color: #333; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #007bff; }
        .gauge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
        }
        .gauge-wrapper {
            text-align: center;
        }
        canvas {
            width: 500px; 
            height: 250px;
        }
        h2 { color: #333; margin-top: 10px; }
        #alert-message {
            margin-top: 30px;
            font-size: 1.2em;
            color: #dc3545; 
            font-weight: bold;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>System Monitoring</h1>
    {% if message %}
        <div id="alert-message">{{ message }}</div>
    {% endif %}

    <div class="gauge-container">
        <div class="gauge-wrapper">
            <canvas id="cpu-gauge"></canvas>
            <h2>CPU Utilization</h2>
        </div>
        <div class="gauge-wrapper">
            <canvas id="mem-gauge"></canvas>
            <h2>Memory Utilization</h2>
        </div>
    </div>

    <script>
        var opts = {
            angle: -0.2,
            lineWidth: 0.2, 
            radiusScale: 0.9, 
            pointer: { length: 0.6, strokeWidth: 0.035, color: '#000000' },
            limitMax: false, limitMin: false,
            colorStart: '#6FADCF', colorStop: '#8FC0DA',
            strokeColor: '#E0E0E0',
            staticLabels: {
                font: "12px sans-serif",
                labels: [0, 20, 40, 60, 80, 100],
                color: "#000000",
                fractionDigits: 0
            },
            staticZones: [
               {strokeStyle: "#30B32D", min: 0, max: 60},  
               {strokeStyle: "#FFDD00", min: 60, max: 80},  
               {strokeStyle: "#F03E3E", min: 80, max: 100}  
            ],
            percentColors: [[0.0, "#a9d70b" ], [0.50, "#f9c802"], [1.0, "#ff0000"]]
        };

        var cpuTarget = document.getElementById('cpu-gauge');
        var cpuGauge = new Gauge(cpuTarget).setOptions(opts);
        cpuGauge.maxValue = 100;
        cpuGauge.setMinValue(0);
        cpuGauge.animationSpeed = 32;
        cpuGauge.set({{ cpu_percent }});
        
        var memTarget = document.getElementById('mem-gauge');
        var memGauge = new Gauge(memTarget).setOptions(opts);
        memGauge.maxValue = 100;
        memGauge.setMinValue(0);
        memGauge.animationSpeed = 32;
        memGauge.set({{ mem_percent }});
    </script>

</body>
</html>
